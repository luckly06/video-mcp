name: Build Windows App

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CI: 'true'
      ELECTRON_MIRROR: 'https://npmmirror.com/mirrors/electron/'
      ELECTRON_BUILDER_BINARIES_MIRROR: 'https://npmmirror.com/mirrors/electron-builder-binaries/'
      ELECTRON_BUILDER_CACHE: ${{ runner.temp }}\\electron-builder-cache

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: station/desktop/package-lock.json

      - name: 缓存 electron-builder 下载
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\\electron-builder-cache
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('station/desktop/package-lock.json', 'station/desktop/package.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-builder-

      - name: 安装 Python 3.13
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 写入运行时密钥
        shell: pwsh
        run: |
          if (-not '${{ secrets.MIMO_API_KEY }}') {
            throw '未配置 MIMO_API_KEY。请到仓库 Settings → Secrets and variables → Actions 新增该 Secret。'
          }
          New-Item -ItemType Directory -Force -Path station/server | Out-Null
          Set-Content -LiteralPath station/server/.env -Value ('MIMO_API_KEY=' + '${{ secrets.MIMO_API_KEY }}') -Encoding UTF8

      - name: 安装 Python 依赖
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright==1.61.0 sherpa-onnx soundfile numpy cffi pycparser
          python -c "import playwright, sherpa_onnx, soundfile, numpy, cffi, pycparser; print('python deps ok')"

      - name: 安装桌面端 npm 依赖
        working-directory: station/desktop
        run: npm ci

      - name: 准备桌面运行时
        working-directory: station/desktop
        shell: pwsh
        env:
          VU_BUILD_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          node scripts/prepare-python-runtime.js
          if (!(Test-Path '../vendor/python/python.exe')) { throw 'python runtime not prepared' }
          if (!(Test-Path '../vendor/asr_models/sherpa-onnx-paraformer-zh-small-2024-03-09/model.int8.onnx')) { throw 'ASR model not found' }

      - name: 打包 Windows NSIS 安装版
        working-directory: station/desktop
        shell: pwsh
        run: |
          npx electron-builder --win nsis --x64 --publish never
          Get-ChildItem dist | Select-Object Name,Length,LastWriteTime

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: video-dedup-desktop-windows
          path: |
            station/desktop/dist/*.exe
            station/desktop/dist/*.yml
            station/desktop/dist/*.blockmap
          if-no-files-found: error

      - name: 发布 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            station/desktop/dist/*.exe
            station/desktop/dist/*.yml
            station/desktop/dist/*.blockmap
          generate_release_notes: true
