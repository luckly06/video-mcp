<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>购物车 / Pure · 商城</title>
  <link rel="stylesheet" href="css/pure.css">
  <style>
    .cart-head {
      display: grid;
      grid-template-columns: 60px 1fr 140px 160px 140px 80px;
      gap: var(--sp-3);
      padding: var(--sp-3);
      align-items: center;
      font-size: var(--fs-sm);
      color: var(--color-text-2);
      background: var(--color-bg-soft);
      border-radius: var(--r-md);
      margin-bottom: var(--sp-2);
    }
    .cart-list { display: flex; flex-direction: column; gap: var(--sp-2); margin-bottom: var(--sp-3); }
    .cart-row {
      display: grid;
      grid-template-columns: 60px 1fr 140px 160px 140px 80px;
      gap: var(--sp-3);
      padding: var(--sp-3);
      background: var(--color-bg);
      border: 1px solid var(--color-line);
      border-radius: var(--r-md);
      align-items: center;
    }
    .row-check input, .checkall input {
      width: 18px; height: 18px; accent-color: var(--color-blue); cursor: pointer;
    }
    .checkall { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
    .row-goods { display: flex; align-items: center; gap: var(--sp-3); }
    .row-goods .thumb {
      width: 80px; height: 80px;
      display: flex; align-items: center; justify-content: center;
      font-size: 48px;
      background: var(--color-bg-soft);
      border-radius: var(--r-md);
    }
    .row-goods .name {
      font-size: var(--fs-base);
      font-weight: 600;
      margin-bottom: 4px;
      letter-spacing: -.01em;
    }
    .row-goods .spec {
      font-size: var(--fs-sm);
      color: var(--color-text-2);
    }
    .row-price { font-size: var(--fs-base); }
    .row-qty {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--color-line);
      border-radius: var(--r-pill);
      padding: 2px;
    }
    .row-qty button {
      width: 32px; height: 32px;
      border-radius: 50%;
      color: var(--color-text-2);
      font-size: var(--fs-lg);
      transition: background .15s;
    }
    .row-qty button:hover { background: var(--color-bg-soft); }
    .row-qty span {
      width: 48px; text-align: center;
      font-size: var(--fs-base);
      font-weight: 500;
    }
    .row-sum {
      font-size: var(--fs-lg);
      font-weight: 600;
      letter-spacing: -.01em;
    }
    .row-del {
      width: 36px; height: 36px;
      font-size: 22px;
      color: var(--color-text-3);
      border-radius: 50%;
      transition: background .15s, color .15s;
    }
    .row-del:hover { background: var(--color-bg-soft); color: var(--color-blue); }
    .cart-foot {
      display: flex; align-items: center; justify-content: space-between;
      padding: var(--sp-3);
      background: var(--color-bg-soft);
      border-radius: var(--r-md);
      gap: var(--sp-3);
    }
    .cart-foot .left { display: flex; align-items: center; gap: var(--sp-3); }
    .cart-foot .right {
      display: flex; align-items: center; gap: var(--sp-3);
      font-size: var(--fs-md);
    }
    .cart-foot .right .big {
      font-size: var(--fs-2xl);
      font-weight: 600;
      letter-spacing: -.01em;
      margin-right: var(--sp-2);
    }

    .empty-cart {
      padding: var(--sp-7) var(--sp-3);
      text-align: center;
    }
    .empty-cart .big {
      font-size: var(--fs-2xl);
      font-weight: 600;
      margin-bottom: var(--sp-2);
      letter-spacing: -.02em;
    }
    .empty-cart p {
      color: var(--color-text-2);
      margin-bottom: var(--sp-3);
    }

    @media (max-width: 1024px) {
      .cart-head { display: none; }
      .cart-row {
        grid-template-columns: 60px 1fr;
        grid-template-areas:
          "check goods"
          "check price"
          "check qty"
          "check sum"
          "check del";
        gap: var(--sp-1) var(--sp-3);
      }
      .row-check  { grid-area: check; }
      .row-goods  { grid-area: goods; }
      .row-price  { grid-area: price; }
      .row-qty    { grid-area: qty; }
      .row-sum    { grid-area: sum; }
      .row-del    { grid-area: del; justify-self: end; }
    }
  </style>
</head>
<body>

<div class="top-bar" id="marqueeTrack"></div>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="site-logo">Pure<span class="light"> · Mall</span></a>
    <nav class="site-nav">
      <a href="index.html">首页</a>
      <a href="products.html">商店</a>
      <a href="cart.html" class="active">购物车</a>
      <a href="checkout.html">结算</a>
      <a href="user.html">账户</a>
    </nav>
    <div class="site-header-actions">
      <a href="user.html">搜索</a>
      <a href="user.html">账户</a>
      <a href="cart.html" class="cart-link">购物车<span class="count">0</span></a>
    </div>
  </div>
</header>

<section class="section" style="padding-top: var(--sp-5);">
  <div class="container">
    <div class="section-head">
      <div class="eyebrow">SHOPPING BAG</div>
      <h2>购物车。</h2>
      <div class="lede">随时查看、调整你的选择。</div>
    </div>
    <div id="cartRoot"></div>
  </div>
</section>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom" style="border-top:none;">
      <span>Copyright © 2026 Pure 商城 Inc.</span>
      <div class="links">
        <a href="#">隐私政策</a>
        <a href="#">使用条款</a>
        <a href="#">销售政策</a>
      </div>
    </div>
  </div>
</footer>

<script src="../js/data.js"></script>
<script src="js/pure.js"></script>
</body>
</html>
