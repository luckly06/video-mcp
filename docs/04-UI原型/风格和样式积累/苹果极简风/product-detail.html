<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>商品详情 / Pure · 商城</title>
  <link rel="stylesheet" href="css/pure.css">
  <style>
    .detail-hero {
      padding: var(--sp-7) 0 var(--sp-5);
      text-align: center;
      border-bottom: 1px solid var(--color-line);
    }
    .detail-hero .eyebrow {
      font-size: var(--fs-md);
      color: var(--color-text-2);
      margin-bottom: var(--sp-2);
      font-weight: 500;
    }
    .detail-hero h1 {
      font-size: clamp(48px, 7vw, 96px);
      font-weight: 600;
      letter-spacing: -.03em;
      line-height: 1;
      margin-bottom: var(--sp-3);
    }
    .detail-hero .lede {
      font-size: var(--fs-lg);
      color: var(--color-text-2);
      max-width: 720px;
      margin: 0 auto var(--sp-3);
    }
    .detail-hero .cta-row {
      display: flex; justify-content: center; align-items: center;
      gap: var(--sp-4);
      flex-wrap: wrap;
      margin-bottom: var(--sp-4);
    }
    .price-big {
      font-size: var(--fs-2xl);
      font-weight: 600;
      letter-spacing: -.01em;
    }
    .price-big .sym { font-size: var(--fs-lg); }
    .price-old {
      font-size: var(--fs-lg);
      color: var(--color-text-3);
      text-decoration: line-through;
    }

    .duo-section { padding: var(--sp-5) 0; }

    .detail-info-section {
      padding: var(--sp-5) 0 var(--sp-6);
      border-top: 1px solid var(--color-line);
      border-bottom: 1px solid var(--color-line);
    }
    .info-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--sp-3);
      max-width: 980px;
      margin: 0 auto;
    }
    .info-block {
      text-align: center;
      padding: var(--sp-3);
      background: var(--color-bg-soft);
      border-radius: var(--r-md);
    }
    .info-block .label {
      font-size: var(--fs-sm);
      color: var(--color-text-2);
      margin-bottom: var(--sp-2);
      font-weight: 500;
    }
    .info-block .value {
      font-size: var(--fs-base);
      font-weight: 500;
    }
    .spec-options {
      display: flex; gap: 8px; justify-content: center;
      flex-wrap: wrap;
    }
    .spec {
      padding: 8px 16px;
      font-size: var(--fs-sm);
      background: var(--color-bg);
      border: 1px solid var(--color-line);
      border-radius: var(--r-pill);
      cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    .spec:hover { border-color: var(--color-blue); }
    .spec.active {
      background: var(--color-blue);
      color: #fff;
      border-color: var(--color-blue);
    }
    .qty-stepper {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--color-line);
      border-radius: var(--r-pill);
      padding: 4px;
    }
    .qty-stepper button {
      width: 36px; height: 36px;
      font-size: var(--fs-lg);
      color: var(--color-text-2);
      border-radius: 50%;
      transition: background .15s;
    }
    .qty-stepper button:hover { background: var(--color-bg); }
    .qty-stepper .q {
      width: 56px; text-align: center;
      font-size: var(--fs-md);
      font-weight: 500;
    }

    .cta-block {
      text-align: center;
      margin: var(--sp-5) 0;
      display: flex; justify-content: center; align-items: center;
      gap: var(--sp-4);
    }

    .desc-block {
      max-width: 720px;
      margin: 0 auto;
      text-align: center;
    }
    .desc-block h2 {
      font-size: var(--fs-2xl);
      font-weight: 600;
      margin-bottom: var(--sp-3);
      letter-spacing: -.02em;
    }
    .desc-block p {
      font-size: var(--fs-md);
      color: var(--color-text-2);
      line-height: 1.6;
    }
    .desc-block p b {
      color: var(--color-text);
      font-weight: 500;
    }

    @media (max-width: 1024px) {
      .info-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

<div class="top-bar" id="marqueeTrack"></div>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="site-logo">Pure<span class="light"> · Mall</span></a>
    <nav class="site-nav">
      <a href="index.html">首页</a>
      <a href="products.html">商店</a>
      <a href="cart.html">购物车</a>
      <a href="checkout.html">结算</a>
      <a href="user.html">账户</a>
    </nav>
    <div class="site-header-actions">
      <a href="user.html">搜索</a>
      <a href="user.html">账户</a>
      <a href="cart.html" class="cart-link">购物车<span class="count">0</span></a>
    </div>
  </div>
</header>

<div id="detailRoot"></div>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom" style="border-top:none;">
      <span>Copyright © 2026 Pure 商城 Inc.</span>
      <div class="links">
        <a href="#">隐私政策</a>
        <a href="#">使用条款</a>
        <a href="#">销售政策</a>
      </div>
    </div>
  </div>
</footer>

<script src="../js/data.js"></script>
<script src="js/pure.js"></script>
</body>
</html>
