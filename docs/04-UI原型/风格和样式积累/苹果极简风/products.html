<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>商店 / Pure · 商城</title>
  <link rel="stylesheet" href="css/pure.css">
  <style>
    .list-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--sp-3);
      padding: var(--sp-3) 0;
      border-bottom: 1px solid var(--color-line);
      margin-bottom: var(--sp-5);
    }
    .list-toolbar .crumb {
      font-size: var(--fs-sm);
      color: var(--color-text-2);
    }
    .list-toolbar .crumb a { color: var(--color-blue); }
    .list-toolbar .info {
      font-size: var(--fs-base);
      color: var(--color-text);
    }
    .list-toolbar .info b { color: var(--color-blue); font-weight: 500; }
    .list-toolbar .sort {
      display: flex; align-items: center; gap: 12px;
      font-size: var(--fs-sm);
      color: var(--color-text-2);
    }
  </style>
</head>
<body>

<div class="top-bar" id="marqueeTrack"></div>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="site-logo">Pure<span class="light"> · Mall</span></a>
    <nav class="site-nav">
      <a href="index.html">首页</a>
      <a href="products.html" class="active">商店</a>
      <a href="products.html?cat=ELEC">电子</a>
      <a href="products.html?cat=HOME">家居</a>
      <a href="products.html?cat=STYLE">服饰</a>
      <a href="products.html?cat=BEAUTY">美妆</a>
      <a href="user.html">账户</a>
    </nav>
    <div class="site-header-actions">
      <a href="user.html">搜索</a>
      <a href="user.html">账户</a>
      <a href="cart.html" class="cart-link">购物车<span class="count">0</span></a>
    </div>
  </div>
</header>

<section class="section" style="padding-top: var(--sp-5);">
  <div class="container">
    <div class="section-head">
      <div class="eyebrow">STORE · 商店</div>
      <h2>所有好物。</h2>
      <div class="lede">每一件都值得挑选。</div>
    </div>

    <div class="list-toolbar">
      <div class="crumb"><a href="index.html">首页</a> / 商店</div>
      <div class="info" id="listInfo">共 <b>0</b> 件商品</div>
      <div class="sort">
        <span>排序：</span>
        <select id="sort">
          <option value="default">推荐</option>
          <option value="sales">销量</option>
          <option value="price-asc">价格 · 升序</option>
          <option value="price-desc">价格 · 降序</option>
          <option value="rating">评分</option>
        </select>
      </div>
    </div>

    <div class="product-grid" id="grid"></div>
  </div>
</section>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom" style="border-top:none;">
      <span>Copyright © 2026 Pure 商城 Inc.</span>
      <div class="links">
        <a href="#">隐私政策</a>
        <a href="#">使用条款</a>
        <a href="#">销售政策</a>
      </div>
    </div>
  </div>
</footer>

<script src="../js/data.js"></script>
<script src="js/pure.js"></script>
</body>
</html>
