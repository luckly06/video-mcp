<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>账户 / Pure · 商城</title>
  <link rel="stylesheet" href="css/pure.css">
  <style>
    .user-grid {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: var(--sp-5);
    }

    .user-side {
      padding: var(--sp-4) 0;
      align-self: start;
    }
    .user-side .avatar {
      width: 80px; height: 80px;
      margin: 0 auto var(--sp-2);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 36px;
      color: #fff;
      background: var(--color-blue);
      border-radius: 50%;
    }
    .user-side .uname {
      text-align: center;
      font-size: var(--fs-md);
      font-weight: 600;
      letter-spacing: -.01em;
      margin-bottom: 4px;
    }
    .user-side .ulevel {
      text-align: center;
      font-size: var(--fs-sm);
      color: var(--color-text-2);
      margin-bottom: var(--sp-3);
      padding-bottom: var(--sp-3);
      border-bottom: 1px solid var(--color-line);
    }
    .user-menu li {
      padding: 12px 0;
      font-size: var(--fs-base);
      color: var(--color-text-2);
      cursor: pointer;
      border-bottom: 1px solid var(--color-line);
      transition: color .15s;
    }
    .user-menu li:last-child { border-bottom: 0; }
    .user-menu li:hover { color: var(--color-text); }
    .user-menu li.active {
      color: var(--color-blue);
      font-weight: 500;
    }

    .user-main { min-width: 0; }
    .panel-block {
      padding: var(--sp-4);
      background: var(--color-bg);
      border: 1px solid var(--color-line);
      border-radius: var(--r-md);
    }
    .block-title {
      font-size: var(--fs-lg);
      font-weight: 600;
      letter-spacing: -.01em;
      padding-bottom: var(--sp-3);
      border-bottom: 1px solid var(--color-line);
      margin-bottom: var(--sp-3);
    }

    .order-card {
      margin-bottom: var(--sp-3);
      border: 1px solid var(--color-line);
      border-radius: var(--r-md);
      overflow: hidden;
    }
    .order-card:last-child { margin-bottom: 0; }
    .order-head {
      display: flex; justify-content: space-between; align-items: center;
      padding: var(--sp-3);
      background: var(--color-bg-soft);
      border-bottom: 1px solid var(--color-line);
    }
    .order-head .oid {
      font-size: var(--fs-sm);
      font-weight: 600;
      color: var(--color-blue);
      margin-right: var(--sp-2);
    }
    .order-head .otime {
      font-size: var(--fs-sm);
      color: var(--color-text-2);
    }
    .status {
      font-size: var(--fs-xs);
      padding: 4px 10px;
      border-radius: var(--r-pill);
      font-weight: 500;
    }
    .order-pending  { background: rgba(255, 149, 0, .15); color: var(--color-orange); }
    .order-shipping { background: rgba(0, 113, 227, .10); color: var(--color-blue); }
    .order-done     { background: rgba(0, 135, 58, .12); color: var(--color-green); }

    .order-body { padding: var(--sp-3); display: flex; flex-direction: column; gap: var(--sp-2); }
    .oi {
      display: grid;
      grid-template-columns: 56px 1fr auto;
      gap: var(--sp-2);
      align-items: center;
    }
    .oi .thumb {
      width: 56px; height: 56px;
      display: flex; align-items: center; justify-content: center;
      font-size: 32px;
      background: var(--color-bg-soft);
      border-radius: var(--r-md);
    }
    .oi .n { font-size: var(--fs-base); font-weight: 500; margin-bottom: 4px; }
    .oi .s { font-size: var(--fs-sm); color: var(--color-text-2); }
    .oi .p { font-size: var(--fs-base); font-weight: 600; }
    .order-foot {
      display: flex; align-items: center; justify-content: space-between;
      padding: var(--sp-2) var(--sp-3);
      border-top: 1px solid var(--color-line);
      font-size: var(--fs-sm);
      color: var(--color-text-2);
    }
    .order-foot b {
      color: var(--color-text);
      font-weight: 600;
      font-size: var(--fs-md);
    }

    .addr-row {
      padding: var(--sp-3);
      margin-bottom: var(--sp-2);
      border: 1px solid var(--color-line);
      border-radius: var(--r-md);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: var(--sp-2);
      align-items: start;
    }
    .addr-row .addr-detail {
      margin-top: 4px;
      font-size: var(--fs-sm);
      color: var(--color-text-2);
    }

    .coupon-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--sp-2);
    }
    .coupon {
      display: flex;
      background: var(--color-bg-soft);
      border: 1px solid var(--color-line);
      border-radius: var(--r-md);
      overflow: hidden;
    }
    .coupon .left {
      width: 120px;
      padding: var(--sp-3);
      background: var(--color-blue);
      color: #fff;
      text-align: center;
    }
    .coupon .left .sym { font-size: var(--fs-base); }
    .coupon .left .num {
      font-size: 40px;
      font-weight: 600;
      line-height: 1;
      letter-spacing: -.02em;
    }
    .coupon .right {
      flex: 1;
      padding: var(--sp-3);
      display: flex; flex-direction: column; justify-content: center;
    }
    .coupon .req {
      font-size: var(--fs-base);
      font-weight: 500;
    }

    .msg-list li {
      padding: var(--sp-2) 0;
      border-bottom: 1px solid var(--color-line);
      font-size: var(--fs-base);
    }
    .msg-list li:last-child { border-bottom: 0; }
    .msg-list .time {
      display: inline-block;
      min-width: 110px;
      font-family: var(--font-mono);
      color: var(--color-text-2);
      font-size: var(--fs-sm);
      margin-right: var(--sp-2);
    }

    @media (max-width: 1024px) {
      .user-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="top-bar" id="marqueeTrack"></div>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="site-logo">Pure<span class="light"> · Mall</span></a>
    <nav class="site-nav">
      <a href="index.html">首页</a>
      <a href="products.html">商店</a>
      <a href="cart.html">购物车</a>
      <a href="checkout.html">结算</a>
      <a href="user.html" class="active">账户</a>
    </nav>
    <div class="site-header-actions">
      <a href="user.html" style="color:var(--color-blue)">账户</a>
      <a href="cart.html" class="cart-link">购物车<span class="count">0</span></a>
    </div>
  </div>
</header>

<section class="section" style="padding-top: var(--sp-5);">
  <div class="container" id="userRoot"></div>
</section>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom" style="border-top:none;">
      <span>Copyright © 2026 Pure 商城 Inc.</span>
      <div class="links">
        <a href="#">隐私政策</a>
        <a href="#">使用条款</a>
        <a href="#">销售政策</a>
      </div>
    </div>
  </div>
</footer>

<script src="../js/data.js"></script>
<script src="js/pure.js"></script>
</body>
</html>
