<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>视频去重工位 · 操作记录原型</title>
<style>
:root {
  --paper:#fffdf7; --canvas:#f1eee3; --ink:#262b29; --muted:#777d78;
  --line:#d8d7ce; --yellow:#f1c65e; --yellow-soft:#faedb9;
  --blue:#5e88a4; --blue-soft:#dceaf1; --green:#4e9877; --green-soft:#dceee5;
  --orange:#ce784c; --orange-soft:#f5dccb; --red:#b65c58; --red-soft:#f1d4d2;
}
* { box-sizing:border-box; }
body { margin:0; background:var(--canvas); color:var(--ink); font-family:"Segoe UI","Microsoft YaHei",sans-serif; }
button,input { font:inherit; }
.sheet { width:min(1040px,calc(100% - 32px)); margin:24px auto 48px; padding:30px 34px 32px; background:var(--paper); border:1px solid #e4e0d2; }
.title { margin:0; color:var(--yellow); font-size:32px; line-height:1; font-weight:700; letter-spacing:1px; }
.top-fields { display:grid; grid-template-columns:1fr 1fr; gap:30px; margin:18px 0 24px; }
.field { display:flex; align-items:center; min-width:0; }
.field-label { padding:4px 11px; border-radius:5px; background:var(--yellow-soft); font-size:13px; font-weight:600; white-space:nowrap; }
.field-value { width:100%; min-width:0; padding:5px 10px; border:0; border-bottom:1px dotted #aaa99f; outline:0; color:var(--ink); background:transparent; font-size:13px; }
.field-value:focus { border-bottom-style:solid; border-bottom-color:#b88924; background:#fffbeb; }
.field-value::placeholder { color:#aaa99f; }
.search-clear { flex:0 0 28px; width:28px; height:28px; margin-left:5px; border:0; border-radius:50%; color:var(--muted); background:transparent; cursor:pointer; line-height:1; }
.search-clear:hover { color:var(--ink); background:#f4efd9; }
.search-clear[hidden] { display:none; }
.layout { display:grid; grid-template-columns:minmax(340px,43%) minmax(0,57%); gap:28px; align-items:start; }
.clock { position:relative; min-height:590px; }
.clock svg { width:100%; height:auto; display:block; overflow:visible; }
.clock-caption { position:absolute; left:20px; bottom:6px; color:var(--muted); font-size:12px; }
.operation-list { padding-top:4px; }
.list-header { display:flex; justify-content:space-between; align-items:end; padding-bottom:11px; border-bottom:1px solid var(--ink); }
.list-header h2 { margin:0; font-size:17px; font-weight:600; }
.count { color:var(--muted); font-size:12px; }
.op-row { display:grid; grid-template-columns:38px minmax(0,1fr); gap:8px; padding:11px 2px 10px; border-bottom:1px solid #b9b9b1; cursor:pointer; transition:background .15s ease; }
.op-row:hover,.op-row.active { background:#faf5e3; }
.op-row.filtered-out { display:none; }
.empty-state { padding:36px 12px; border-bottom:1px solid #b9b9b1; color:var(--muted); text-align:center; font-size:13px; }
.segment.filtered-out,.phase-label.filtered-out,.boundary.filtered-out { display:none; }
.op-num { padding-top:2px; font-family:Consolas,monospace; font-size:13px; font-weight:600; }
.op-top { display:flex; align-items:center; justify-content:space-between; gap:12px; }
.op-name { min-width:0; font-size:14px; font-weight:600; overflow-wrap:anywhere; }
.op-time { color:var(--muted); font-family:Consolas,monospace; font-size:12px; white-space:nowrap; }
.op-summary { margin:3px 0 5px; color:#515754; font-size:12px; line-height:1.5; }
.op-meta { display:flex; flex-wrap:wrap; align-items:center; gap:6px 12px; color:var(--muted); font-size:11px; }
.tag { padding:2px 7px; border-radius:999px; font-size:11px; }
.tag.info { color:var(--blue); background:var(--blue-soft); }
.tag.confirm { color:#9b6b13; background:var(--yellow-soft); }
.tag.pass { color:var(--green); background:var(--green-soft); }
.tag.blocked { color:var(--red); background:var(--red-soft); }
.unit-note { margin-top:18px; padding:12px 14px; border-left:3px solid var(--yellow); background:#fbf7e9; color:#646961; font-size:12px; line-height:1.7; }
.tick-label { fill:var(--ink); font-family:Consolas,monospace; font-size:11px; }
.phase-label { font-size:12px; font-weight:600; text-anchor:middle; }
.center-label { fill:var(--muted); font-size:11px; text-anchor:middle; }
.segment { cursor:pointer; transition:opacity .15s ease; }
.segment:hover,.segment.active { opacity:1; }
.segment.dim { opacity:.35; }
@media (max-width:820px) { .sheet{padding:24px 20px}.layout{grid-template-columns:1fr}.clock{min-height:0;max-width:520px;margin:auto}.top-fields{grid-template-columns:1fr;gap:10px}.operation-list{padding-top:12px} }
@media (max-width:480px) { .sheet{width:calc(100% - 16px);margin:8px auto 24px;padding:20px 14px}.title{font-size:27px}.field-value{white-space:normal}.op-top{align-items:flex-start;flex-direction:column;gap:1px} }
</style>
</head>
<body>
<main class="sheet">
  <h1 class="title">OPERATION LOG</h1>
  <section class="top-fields" aria-label="操作记录搜索">
    <label class="field" for="session-date"><span class="field-label">会话：</span><input id="session-date" class="field-value" type="date" value="2026-08-05" aria-label="按会话日期搜索"><button id="clear-date" class="search-clear" type="button" aria-label="清空日期搜索" title="清空日期">×</button></label>
    <label class="field" for="status-search"><span class="field-label">状态：</span><input id="status-search" class="field-value" type="search" placeholder="输入状态、工具或摘要" autocomplete="off" aria-label="按文字搜索操作记录"><button id="clear-status" class="search-clear" type="button" aria-label="清空文字搜索" title="清空搜索" hidden>×</button></label>
  </section>

  <section class="layout">
    <div class="clock">
      <svg id="timeline-svg" viewBox="0 0 430 590" role="img" aria-labelledby="clock-title clock-desc">
        <title id="clock-title">视频去重工位操作记录半圆时间轴</title>
        <desc id="clock-desc">垂直右半圆从十四点三十分到十五点十分，每五分钟一个刻度，彩色区段代表不同项目操作。</desc>
      </svg>
      <div class="clock-caption">单位：每格 5 分钟 · 点击色段查看对应记录</div>
    </div>

    <div class="operation-list">
      <div class="list-header"><h2>验收操作记录</h2><span class="count" id="record-count">8 条记录</span></div>
      <div id="records"></div>
      <div class="unit-note"><strong>单位建议：</strong>当前会话用“5 分钟/格”；超过 2 小时自动切到“15 分钟/格”；跨天则按日期分组，每个日期单独一条弧线。事件仍保留精确到秒的实际时间。</div>
    </div>
  </section>
</main>
<script>
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("timeline-svg");
const recordsEl = document.getElementById("records");
const recordCountEl = document.getElementById("record-count");
const dateInput = document.getElementById("session-date");
const statusInput = document.getElementById("status-search");
const clearDateButton = document.getElementById("clear-date");
const clearStatusButton = document.getElementById("clear-status");
const center = { x:56, y:290 };
const totalMinutes = 40;
const outerR = 230;
const bandOuter = 214;
const bandInner = 160;
const labelR = 231;
const baseMinutes = 14 * 60 + 30;
const events = [
  { id:1, date:"2026-08-05", start:0, end:3, time:"14:30:08", name:"list_assets", type:"info", status:"素材读取", duration:"0.2 秒", summary:"从项目 input/ 读取生产素材，发现 2 个可处理视频。" },
  { id:2, date:"2026-08-05", start:4, end:8, time:"14:34:16", name:"probe_video", type:"info", status:"探测完成", duration:"0.8 秒", summary:"读取分辨率、时长和音视频流，下班来接我.mp4 可进入处理。" },
  { id:3, date:"2026-08-05", start:9, end:12, time:"14:39:02", name:"dedup_video · confirm", type:"confirm", status:"人工确认", duration:"等待 18 秒", summary:"确认 medium 等级、竖屏尺寸及输出参数后允许执行。" },
  { id:4, date:"2026-08-05", start:13, end:20, time:"14:42:25", name:"dedup_video", type:"pass", status:"去重完成", duration:"1 分 36 秒", summary:"生成单条去重视频，MD5、分辨率、时长和最短时长检查通过。" },
  { id:5, date:"2026-08-05", start:21, end:25, time:"14:50:11", name:"self_check", type:"pass", status:"五项自检", duration:"2.1 秒", summary:"pHash 使用 signature 兜底；交付门按当前自检结果给出判定。" },
  { id:6, date:"2026-08-05", start:26, end:34, time:"14:55:30", name:"batch_fission", type:"pass", status:"裂变完成", duration:"1 分 42 秒", summary:"生成 5 个变体，MD5 全部唯一，距离矩阵全部达标。" },
  { id:7, date:"2026-08-05", start:35, end:37, time:"15:05:04", name:"delete_output", type:"blocked", status:"安全阻断", duration:"即时", summary:"第 4 级危险操作被硬阻断，output/ 中的验收产物保持不变。" },
  { id:8, date:"2026-08-05", start:38, end:40, time:"15:07:12", name:"open_output", type:"info", status:"打开产物", duration:"0.1 秒", summary:"打开项目固定 output/ 目录，供用户人工检查视频结果。" }
];
const colors = {
  info:{ fill:"#b7d3e2", stroke:"#5e88a4" },
  confirm:{ fill:"#f3d783", stroke:"#b88924" },
  pass:{ fill:"#9fcdae", stroke:"#4e9877" },
  blocked:{ fill:"#e0aaa6", stroke:"#b65c58" }
};
function node(tag, attrs={}) { const n=document.createElementNS(NS,tag); Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,v)); return n; }
function point(r, minute) { const angle=-Math.PI/2+(minute/totalMinutes)*Math.PI; return { x:center.x+r*Math.cos(angle), y:center.y+r*Math.sin(angle) }; }
function arcPath(r, from, to) { const a=point(r,from), b=point(r,to); const large=(to-from)>totalMinutes/2?1:0; return `M ${a.x} ${a.y} A ${r} ${r} 0 ${large} 1 ${b.x} ${b.y}`; }
function bandPath(from,to) { const a=point(bandOuter,from), b=point(bandOuter,to), c=point(bandInner,to), d=point(bandInner,from); const large=(to-from)>totalMinutes/2?1:0; return `M ${a.x} ${a.y} A ${bandOuter} ${bandOuter} 0 ${large} 1 ${b.x} ${b.y} L ${c.x} ${c.y} A ${bandInner} ${bandInner} 0 ${large} 0 ${d.x} ${d.y} Z`; }
function fmtMinute(offset) { const m=baseMinutes+offset; return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0"); }
function buildClock() {
  svg.appendChild(node("path",{d:arcPath(outerR,0,totalMinutes),fill:"none",stroke:"#deddd5","stroke-width":"1"}));
  svg.appendChild(node("path",{d:arcPath(bandOuter,0,totalMinutes),fill:"none",stroke:"#ece9dc","stroke-width":String(bandOuter-bandInner),opacity:".58"}));
  const guide1=node("path",{d:arcPath(122,0,totalMinutes),fill:"none",stroke:"#ddd9ca","stroke-width":"1","stroke-dasharray":"3 5"}); svg.appendChild(guide1);
  const guide2=node("path",{d:arcPath(72,0,totalMinutes),fill:"none",stroke:"#ddd9ca","stroke-width":"1","stroke-dasharray":"3 5"}); svg.appendChild(guide2);
  events.forEach(e=>{
    const p=node("path",{d:bandPath(e.start,e.end),fill:colors[e.type].fill,stroke:colors[e.type].stroke,"stroke-width":"1",class:"segment",tabindex:"0","data-id":e.id}); svg.appendChild(p);
    const boundary=point(bandInner,e.start);
    svg.appendChild(node("line",{x1:center.x,y1:center.y,x2:boundary.x,y2:boundary.y,stroke:"#aaa99f","stroke-width":".7","stroke-dasharray":"2 3",class:"boundary","data-id":e.id}));
    const mid=(e.start+e.end)/2, lp=point((bandOuter+bandInner)/2,mid);
    const t=node("text",{x:lp.x,y:lp.y+4,class:"phase-label",fill:colors[e.type].stroke,"pointer-events":"none","data-id":e.id}); t.textContent=String(e.id); svg.appendChild(t);
  });
  const lastBoundary=point(bandInner,totalMinutes);
  svg.appendChild(node("line",{x1:center.x,y1:center.y,x2:lastBoundary.x,y2:lastBoundary.y,stroke:"#aaa99f","stroke-width":".7","stroke-dasharray":"2 3"}));
  for(let m=0;m<=totalMinutes;m+=5){
    const a=point(outerR,m), b=point(outerR-10,m);
    svg.appendChild(node("line",{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:"#3d413f","stroke-width":m%10===0?"1.6":"1"}));
    const l=point(labelR,m), t=node("text",{x:l.x,y:l.y+4,"text-anchor":"middle",class:"tick-label"}); t.textContent=fmtMinute(m); svg.appendChild(t);
  }
  const centerDot=node("circle",{cx:center.x,cy:center.y,r:"4",fill:"#333734"}); svg.appendChild(centerDot);
  const title=node("text",{x:"118",y:"282",class:"center-label"}); title.textContent="当前验收会话"; svg.appendChild(title);
  const range=node("text",{x:"118",y:"302",class:"center-label","font-size":"13","font-weight":"600",fill:"#262b29"}); range.textContent="14:30 — 15:10"; svg.appendChild(range);
}
function buildRecords() {
  recordsEl.innerHTML=events.map(e=>`<article class="op-row" data-id="${e.id}" tabindex="0"><div class="op-num">${e.id}.</div><div><div class="op-top"><span class="op-name">${e.name}</span><time class="op-time">${e.time}</time></div><p class="op-summary">${e.summary}</p><div class="op-meta"><span class="tag ${e.type}">${e.status}</span><span>耗时 ${e.duration}</span><span>event_${String(e.id).padStart(2,"0")}</span></div></div></article>`).join("");
}
function selectEvent(id) {
  document.querySelectorAll(".segment").forEach(el=>{ const hit=Number(el.dataset.id)===id; el.classList.toggle("active",hit); el.classList.toggle("dim",!hit); });
  document.querySelectorAll(".op-row").forEach(el=>{ const hit=Number(el.dataset.id)===id; el.classList.toggle("active",hit); if(hit) el.scrollIntoView({block:"nearest",behavior:"smooth"}); });
}
function clearSelection(){ document.querySelectorAll(".segment").forEach(el=>el.classList.remove("active","dim")); document.querySelectorAll(".op-row").forEach(el=>el.classList.remove("active")); }
function applyFilters() {
  const selectedDate=dateInput.value;
  const query=statusInput.value.trim().toLocaleLowerCase("zh-CN");
  let visibleCount=0;
  events.forEach(e=>{
    const text=[e.status,e.name,e.summary,e.type,e.duration].join(" ").toLocaleLowerCase("zh-CN");
    const visible=(!selectedDate||e.date===selectedDate)&&(!query||text.includes(query));
    document.querySelectorAll(`[data-id="${e.id}"]`).forEach(el=>el.classList.toggle("filtered-out",!visible));
    if(visible) visibleCount++;
  });
  recordCountEl.textContent=visibleCount+" 条记录";
  const existingEmpty=recordsEl.querySelector(".empty-state");
  if(existingEmpty) existingEmpty.remove();
  if(!visibleCount){ const empty=document.createElement("div"); empty.className="empty-state"; empty.textContent="没有符合搜索条件的操作记录"; recordsEl.appendChild(empty); }
  clearDateButton.hidden=!selectedDate;
  clearStatusButton.hidden=!query;
  clearSelection();
}
buildClock(); buildRecords(); applyFilters();
dateInput.addEventListener("input",applyFilters);
statusInput.addEventListener("input",applyFilters);
clearDateButton.addEventListener("click",()=>{ dateInput.value=""; applyFilters(); dateInput.focus(); });
clearStatusButton.addEventListener("click",()=>{ statusInput.value=""; applyFilters(); statusInput.focus(); });
document.addEventListener("click",e=>{ const hit=e.target.closest("[data-id]"); if(hit&&!hit.classList.contains("filtered-out")) selectEvent(Number(hit.dataset.id)); else if(!e.target.closest(".field")) clearSelection(); });
document.addEventListener("keydown",e=>{ if((e.key==="Enter"||e.key===" ")&&e.target.dataset.id&&!e.target.classList.contains("filtered-out")){ e.preventDefault(); selectEvent(Number(e.target.dataset.id)); } });
</script>
</body>
</html>
